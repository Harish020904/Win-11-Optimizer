[package]
name = "win11-optimizer"
version = "2.0.0"
edition = "2021"
authors = ["Win11 Optimizer Team"]
description = "Production-grade Windows 11 optimization TUI"
license = "MIT"
repository = "https://github.com/Harish020904/Win-11-Optimizer"
readme = "README.md"
keywords = ["windows", "optimization", "tui", "system"]
categories = ["command-line-utilities"]

[dependencies]
# TUI Framework
ratatui = "0.26"
crossterm = "0.27"

# Async Runtime
tokio = { version = "1", features = ["full", "process"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI Argument Parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Directory utilities
dirs = "5"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
]}

[dev-dependencies]
tempfile = "3"
mockall = "0.12"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[[bin]]
name = "win11-optimizer"
path = "src/main.rs"
