[package]
name = "win11-optimizer-tui"
version = "2.0.0"
edition = "2021"
authors = ["Win11 Optimizer Team"]
license = "MIT"

[dependencies]
ratatui = { version = "=0.26.3", features = ["all-widgets"] }
crossterm = "=0.27.0"
tokio = { version = "=1.51.0", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
