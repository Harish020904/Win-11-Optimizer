name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $distDir = "dist"
          
          New-Item -ItemType Directory -Force -Path $distDir
          
          # Copy binary
          Copy-Item "target/x86_64-pc-windows-msvc/release/win11-optimizer.exe" "$distDir/"
          
          # Copy modules and runtime
          Copy-Item -Recurse "modules" "$distDir/"
          Copy-Item -Recurse "runtime" "$distDir/"
          
          # Copy docs
          Copy-Item "README.md" "$distDir/"
          Copy-Item "LICENSE" "$distDir/"
          
          # Create zip
          $zipName = "win11-optimizer-$version-windows-x64.zip"
          Compress-Archive -Path "$distDir/*" -DestinationPath $zipName
          
          # Generate checksums
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "checksums.txt" -Encoding utf8
          
          $exeHash = (Get-FileHash -Path "$distDir/win11-optimizer.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  win11-optimizer.exe" | Out-File -FilePath "checksums.txt" -Append -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            *.zip
            checksums.txt
            dist/win11-optimizer.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Win11 Optimizer ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          body: |
            ## Win11 Optimizer ${{ steps.version.outputs.version }}
            
            ### Installation
            
            **One-liner install (PowerShell):**
            ```powershell
            iwr -useb https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```
            
            **Manual download:**
            1. Download `win11-optimizer-${{ steps.version.outputs.version }}-windows-x64.zip`
            2. Extract to a directory of your choice
            3. Run `win11-optimizer.exe`
            
            ### Verification
            
            Verify download integrity with checksums:
            ```powershell
            # Check SHA256
            (Get-FileHash win11-optimizer.exe -Algorithm SHA256).Hash
            # Compare with checksums.txt
            ```
            
            ### What's New
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
          files: |
            *.zip
            checksums.txt
            win11-optimizer.exe
