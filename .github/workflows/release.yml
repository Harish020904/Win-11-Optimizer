name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-package:
    name: Build and Package
    runs-on: self-hosted-windows-signer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: PowerShell/PowerShell@v2

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace 'v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Run full test suite
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0
          Invoke-Pester -Path ./tests -OutputFormat NUnitXml -OutputFile test-results.xml

      - name: Package artifact
        run: |
          .\scripts\package.ps1 -Version ${{ steps.version.outputs.version }} -OutputPath .\dist

      - name: Compute SHA256 checksum
        run: |
          $hash = Get-FileHash -Algorithm SHA256 .\dist\win11-optimizer-${{ steps.version.outputs.version }}.zip
          $hash.Hash | Out-File .\dist\win11-optimizer-${{ steps.version.outputs.version }}.zip.sha256 -Encoding utf8

      - name: Sign artifact (Authenticode)
        run: |
          $certPath = $env:CODE_SIGN_CERT_PATH
          $certPass = $env:CODE_SIGN_CERT_PASSWORD
          signtool sign /fd SHA256 /f $certPath /p $certPass .\dist\win11-optimizer-${{ steps.version.outputs.version }}.zip
        env:
          CODE_SIGN_CERT_PATH: ${{ secrets.CODE_SIGN_CERT_PATH }}
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}

      - name: Sign artifact (GPG)
        if: runner.os == 'Linux'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          gpg --output .\dist\win11-optimizer-${{ steps.version.outputs.version }}.zip.sig --detach-sign .\dist\win11-optimizer-${{ steps.version.outputs.version }}.zip
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: |
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip.sha256
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip.sig

  publish-github:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts
          path: ./dist

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace 'v', ''
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat > release-notes.md << EOF
          ## Win11 Optimizer v${{ steps.version.outputs.version }}

          See [CHANGELOG.md](CHANGELOG.md) for details.

          ### Installation

          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/yourorg/win11-optimizer/releases/download/v${{ steps.version.outputs.version }}/win11-optimizer-${{ steps.version.outputs.version }}.zip" -OutFile "win11-optimizer.zip"
          Expand-Archive -Path win11-optimizer.zip -DestinationPath .
          \`\`\`

          ### Verification

          \`\`\`powershell
          # SHA256
          Get-FileHash -Algorithm SHA256 win11-optimizer-${{ steps.version.outputs.version }}.zip
          # Compare with: $(cat win11-optimizer-${{ steps.version.outputs.version }}.zip.sha256)
          \`\`\`

          ### Checksums

          \`\`\`
          $(cat dist/win11-optimizer-${{ steps.version.outputs.version }}.zip.sha256)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: |
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip.sha256
            dist/win11-optimizer-${{ steps.version.outputs.version }}.zip.sig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}