# Security Remediation CI Pipeline
# Generated by: claude-code
# RUN INSIDE WINDOWS VM OR CI ONLY (for PowerShell steps)
#
# This workflow validates metadata, file permissions, runs Pester tests,
# and performs integration testing on the Minimal layer in a Windows VM.

name: Security Remediation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Job 1: Metadata Validation ────────────────────────────────────
  metadata-validation:
    name: Validate Module Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all metadata.yaml files
        run: |
          find modules/ -name 'metadata.yaml' | while read f; do
            echo "Linting: $f"
            yamllint -d relaxed "$f"
          done

      - name: Validate required metadata fields
        run: |
          FAILED=0
          REQUIRED_FIELDS="id name layer description reversible"
          for f in $(find modules/ -name 'metadata.yaml'); do
            for field in $REQUIRED_FIELDS; do
              if ! grep -q "^${field}:" "$f"; then
                echo "FAIL: $f missing field '$field'"
                FAILED=1
              fi
            done
          done
          if [ $FAILED -eq 1 ]; then
            echo "::error::Metadata validation failed"
            exit 1
          fi
          echo "All metadata files valid"

      - name: Validate manifest references
        run: |
          FAILED=0
          for manifest in runtime/manifests/*.yaml; do
            echo "Checking: $manifest"
            layer=$(grep '^layer:' "$manifest" | awk '{print $2}')
            grep '^\s*-\s' "$manifest" | sed 's/.*-\s*//' | while read mod; do
              mod=$(echo "$mod" | tr -d '[:space:]')
              if [ ! -d "modules/$layer/$mod" ]; then
                echo "FAIL: Module '$mod' in $manifest not found at modules/$layer/$mod"
                FAILED=1
              fi
            done
          done
          if [ $FAILED -eq 1 ]; then exit 1; fi
          echo "All manifest references valid"

  # ── Job 2: File Permissions Check ─────────────────────────────────
  file-permissions:
    name: No Executable Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for files with execute bit
        run: |
          EXEC_FILES=$(find . -type f -perm /111 -not -path './.git/*' -not -name '*.sh')
          if [ -n "$EXEC_FILES" ]; then
            echo "::error::Files with execute bit found (must be non-executable):"
            echo "$EXEC_FILES"
            exit 1
          fi
          echo "No files with execute bits found"

  # ── Job 3: Pester Unit Tests ──────────────────────────────────────
  pester-tests:
    name: Pester Unit Tests
    runs-on: windows-latest
    needs: [metadata-validation, file-permissions]
    steps:
      - uses: actions/checkout@v4

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Install Pester
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck
          Import-Module Pester

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Run Unit Tests
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/unit/'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './test-results/unit-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Filter.ExcludeTag = @('VM')
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/unit-results.xml

  # ── Job 4: Integration Tests (Minimal Layer) ─────────────────────
  integration-minimal:
    name: Integration Tests — Minimal Layer
    runs-on: windows-latest
    needs: [pester-tests]
    steps:
      - uses: actions/checkout@v4

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Install Pester
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck
          Import-Module Pester

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Run Structural Integration Tests
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/integration/'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './test-results/integration-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Filter.Tag = @('Integration')
          $config.Filter.ExcludeTag = @('VM')
          Invoke-Pester -Configuration $config

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/integration-results.xml

  # ── Job 5: VM Integration (Self-Hosted) ──────────────────────────
  # This job requires a self-hosted runner with:
  #   - Windows 11 VM with snapshot/restore capability
  #   - Tag: 'windows-vm'
  #   - PowerShell 5.1+ or pwsh 7+
  #   - Administrator access
  vm-integration:
    name: VM Integration — Full Lifecycle
    runs-on: [self-hosted, windows-vm]
    needs: [integration-minimal]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Create VM Snapshot
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          # Create a restore point before applying any changes
          try {
            Enable-ComputerRestore -Drive 'C:\'
            Checkpoint-Computer -Description 'Pre-WinOptimizer-Test' -RestorePointType MODIFY_SETTINGS
            Write-Host 'Restore point created'
          } catch {
            Write-Host "WARNING: Could not create restore point (ephemeral VM?): $_"
          }

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Install Pester
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Apply Minimal Layer
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          . ./runtime/utils.ps1
          $manifest = Get-Content ./runtime/manifests/minimal.yaml -Raw
          Write-Host "Applying Minimal layer modules..."
          & ./modules/minimal/disable-telemetry/apply.ps1
          & ./modules/minimal/disable-widgets/apply.ps1

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Verify Minimal Layer
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          Write-Host "Verifying Minimal layer..."
          & ./modules/minimal/disable-telemetry/verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "Telemetry verify failed" }
          & ./modules/minimal/disable-widgets/verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "Widgets verify failed" }

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Test Windows Update Still Works
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          $wuService = Get-Service wuauserv -ErrorAction SilentlyContinue
          if ($wuService.Status -ne 'Running') {
            Start-Service wuauserv -ErrorAction SilentlyContinue
          }
          $wuService = Get-Service wuauserv
          if ($wuService.Status -eq 'Running' -or $wuService.StartType -ne 'Disabled') {
            Write-Host "PASS: Windows Update service is functional"
          } else {
            throw "FAIL: Windows Update service is disabled or broken"
          }

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Test Network Connectivity
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          $result = Test-NetConnection -ComputerName 'www.microsoft.com' -Port 443
          if ($result.TcpTestSucceeded) {
            Write-Host "PASS: Network connectivity OK"
          } else {
            throw "FAIL: Network connectivity broken after optimization"
          }

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Rollback Minimal Layer
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          Write-Host "Rolling back Minimal layer..."
          & ./modules/minimal/disable-widgets/rollback.ps1
          & ./modules/minimal/disable-telemetry/rollback.ps1

      # RUN INSIDE WINDOWS VM OR CI ONLY
      - name: Run Full Pester Test Suite
        shell: pwsh
        run: |
          # RUN INSIDE WINDOWS VM OR CI ONLY
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './test-results/vm-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload VM Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-results
          path: ./test-results/

