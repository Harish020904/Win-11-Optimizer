name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-config-check:
    name: Security Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SECURITY.md for placeholder values
        run: |
          if grep -q "CHANGEME" SECURITY.md; then
            echo "ERROR: SECURITY.md contains placeholder values (CHANGEME)"
            echo "Please replace CHANGEME with actual security contact information"
            grep -n "CHANGEME" SECURITY.md
            exit 1
          fi

  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .github/psscriptanalyzer.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  unit-test:
    name: Unit Tests (Pester)
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests/unit -OutputFormat NUnitXml -OutputFile test-results.xml -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml

  integration-test-minimal:
    name: Integration Test - Minimal Layer
    runs-on: windows-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0

      - name: Run Minimal layer integration tests
        run: |
          # Create system restore point
          Checkpoint-Computer -Description "Pre-test baseline" -RestorePointType "MODIFY_SETTINGS"

          # Preview Minimal layer
          powershell -NoProfile -ExecutionPolicy Bypass -File ./runtime/godmode.ps1 --manifest ./runtime/manifests/minimal.yaml --preview

          # Apply Minimal layer
          powershell -NoProfile -ExecutionPolicy Bypass -File ./runtime/godmode.ps1 --manifest ./runtime/manifests/minimal.yaml --apply

          # Run verification
          powershell -NoProfile -ExecutionPolicy Bypass -File ./runtime/godmode.ps1 --manifest ./runtime/manifests/minimal.yaml --verify

          # Run Pester integration tests
          $result = Invoke-Pester -Path ./tests/integration/minimal -OutputFormat NUnitXml -OutputFile integration-results.xml -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Rollback Minimal layer
        if: always()
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./runtime/godmode.ps1 --manifest ./runtime/manifests/minimal.yaml --rollback

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-minimal
          path: integration-results.xml

  security-scan:
    name: Security Scan
    # TruffleHog action runs via Linux container image; must use Linux runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so TruffleHog can scan it
          fetch-depth: 0

      - name: Scan for secrets
        # SEC-004: Pinned to specific SHA for supply chain security (v3.94.2)
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b
        with:
          path: ./
          # Only scan the diff on pull requests, scan full history on push
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  build-info:
    name: Generate Build Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.info.outputs.commit }}
      date: ${{ steps.info.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' build-info.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate build info
        id: info
        run: |
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Write build-info.json
        run: |
          cat > build-info.json << EOF
          {
            "commit": "${{ github.sha }}",
            "tag": "${{ steps.version.outputs.version }}",
            "built_by": "ci@github-actions",
            "build_time_utc": "${{ steps.info.outputs.date }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          cat build-info.json

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
